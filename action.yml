name: Setup Raven
description: Install the Raven toolchain (raven, rvpm) from GitHub releases and cache rvpm packages
author: martian56
branding:
  icon: feather
  color: gray-dark

inputs:
  raven-version:
    description: >-
      The Raven release to install, for example "3.0.0". The default
      "latest" installs the newest release.
    required: false
    default: latest
  cache:
    description: >-
      Cache the rvpm package cache (~/.rvpm/cache), keyed on the rv.toml
      files in the repository. "true" or "false".
    required: false
    default: "true"
  token:
    description: GitHub token used to download the release assets.
    required: false
    default: ${{ github.token }}

outputs:
  raven-version:
    description: The release tag that was installed, for example "v3.0.0".
    value: ${{ steps.resolve.outputs.tag }}

runs:
  using: composite
  steps:
    - name: Resolve release tag
      id: resolve
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        if [ "${{ inputs.raven-version }}" = "latest" ]; then
          TAG=$(gh release view --repo martian56/raven --json tagName --jq .tagName)
        else
          TAG="v${{ inputs.raven-version }}"
        fi
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        echo "Installing Raven $TAG"

    - name: Install Raven (Linux)
      if: runner.os == 'Linux'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        gh release download "${{ steps.resolve.outputs.tag }}" --repo martian56/raven \
          --pattern '*x86_64-unknown-linux-gnu.tar.gz' --output raven.tar.gz
        mkdir -p "$HOME/raven-toolchain"
        tar -xzf raven.tar.gz --strip-components=1 -C "$HOME/raven-toolchain"
        rm raven.tar.gz
        echo "$HOME/raven-toolchain" >> "$GITHUB_PATH"

    - name: Install Raven (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        gh release download "${{ steps.resolve.outputs.tag }}" --repo martian56/raven --pattern '*x86_64-pc-windows-msvc.zip' --output raven.zip
        New-Item -ItemType Directory -Force "$env:USERPROFILE\raven-toolchain" | Out-Null
        Expand-Archive raven.zip -DestinationPath "$env:USERPROFILE\raven-toolchain" -Force
        Remove-Item raven.zip
        Add-Content $env:GITHUB_PATH "$env:USERPROFILE\raven-toolchain"

    - name: Unsupported platform
      if: runner.os == 'macOS'
      shell: bash
      run: |
        echo "::error::setup-raven: no macOS release assets are published yet (Linux and Windows are supported)"
        exit 1

    - name: Cache rvpm packages
      if: inputs.cache == 'true'
      uses: actions/cache@v5
      with:
        path: ~/.rvpm/cache
        key: rvpm-${{ runner.os }}-${{ hashFiles('**/rv.toml') }}
        restore-keys: |
          rvpm-${{ runner.os }}-
